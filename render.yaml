services:
  - type: web
    name: investtrack
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: LIVE_TRADING_ENABLED
        value: "false"
